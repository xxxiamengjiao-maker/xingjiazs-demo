<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI行家助手 · 企微卡片Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #ededed;
      display: flex; justify-content: center;
      align-items: flex-start; min-height: 100vh; padding: 30px 16px;
    }
    .phone {
      width: 360px; background: #f5f5f5; border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18); overflow: hidden;
      border: 5px solid #222; display: flex; flex-direction: column; height: 700px;
    }
    .phone-bar {
      background: #fff; text-align: center; font-size: 13px; font-weight: 600;
      padding: 10px 0 6px; color: #111; border-bottom: 1px solid #eee;
      letter-spacing: 1px; flex-shrink: 0;
    }
    .chat-area {
      flex: 1; padding: 14px 12px;
      display: flex; flex-direction: column;
      overflow-y: auto; background: #f5f5f5;
    }
    .wecom-card {
      background: #fff; border-radius: 10px;
      overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.10); width: 100%;
      display: flex; flex-direction: column;
    }

    /* 固定头部 */
    .card-header { padding: 14px 16px 10px; flex-shrink: 0; }
    .card-title { font-size: 15px; font-weight: 700; color: #111; }
    .card-domain { font-size: 12.5px; color: #888; margin-top: 3px; display: none; }
    .card-domain.visible { display: block; }
    .card-sub { font-size: 12.5px; color: #888; margin-top: 6px; line-height: 1.7; }

    /* 首页菜单按钮 */
    .menu-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      padding: 4px 12px 12px; flex-shrink: 0;
    }
    .menu-btn {
      background: #1677ff; color: #fff; border: none; border-radius: 8px;
      padding: 11px 8px; font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background 0.15s; text-align: center;
    }
    .menu-btn:hover { background: #0958d9; }
    .menu-btn:active { opacity: 0.85; }
    .menu-btn.other { background: #fff; color: #1677ff; border: 1.5px solid #1677ff; }
    .menu-btn.other:hover { background: #e6f0ff; }

    /* 面板通用 */
    .sub-panel     { display: none; flex-direction: column; min-height: 0; overflow: hidden; }
    .sub-panel.active     { display: flex; }
    .suggest-panel { display: none; flex-direction: column; min-height: 0; overflow: hidden; }
    .suggest-panel.active { display: flex; }

    /* 滚动区 */
    .scroll-body { flex: 1; overflow-y: auto; min-height: 0; }
    .scroll-body::-webkit-scrollbar { width: 3px; }
    .scroll-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    /* 第二层：子菜单列表 */
    .sub-list { display: flex; flex-direction: column; padding: 0 16px 8px; }
    .sub-item {
      display: flex; flex-direction: column;
      padding: 11px 0;
      border-top: 1px solid #f2f2f2;
      cursor: pointer;
    }
    .sub-item:first-of-type { border-top: none; }
    .sub-item-title { font-size: 13.5px; font-weight: 600; color: #111; }
    .sub-item-desc  { font-size: 12px; color: #888; margin-top: 2px; line-height: 1.5; }

    /* 分割线带文字 */
    .section-divider {
      font-size: 11px; color: #bbb;
      padding: 10px 0 4px;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0; user-select: none;
    }
    .section-divider::before,
    .section-divider::after {
      content: ''; flex: 1; height: 1px; background: #e8e8e8;
    }

    /* 第三层：suggest 列表 */
    .suggest-list { display: flex; flex-direction: column; padding: 4px 16px 8px; }
    .suggest-item {
      padding: 9px 0;
      border-top: 1px solid #f2f2f2;
      flex-shrink: 0;
    }
    .suggest-item:first-of-type { border-top: none; }
    .suggest-text { font-size: 13px; color: #111; line-height: 1.65; }

    /* tags 内容改为普通文字，灰色小字，逗号分隔 */
    .suggest-tags-text {
      font-size: 12px; color: #888; line-height: 1.6; margin-top: 3px;
    }

    .example-row { font-size: 11.5px; color: #999; line-height: 1.6; margin-top: 3px; }

    /* 固定底部按钮 */
    .card-footer {
      display: flex; border-top: 1px solid #ebebeb;
      padding: 8px 12px; gap: 8px; flex-shrink: 0;
    }
    .footer-btn {
      flex: 1; padding: 9px; border-radius: 6px;
      font-size: 13px; cursor: pointer; border: none;
      transition: background 0.15s; text-align: center; font-weight: 500;
    }
    .footer-btn.secondary {
      background: #f5f5f5; color: #555;
      border: 1px solid #e0e0e0;
    }
    .footer-btn.secondary:hover { background: #ebebeb; }
    .footer-btn.primary { background: #1677ff; color: #fff; }
    .footer-btn.primary:hover { background: #0958d9; }

    @keyframes fadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp 0.18s ease forwards; }
  </style>
</head>
<body>
<div class="phone">
  <div class="phone-bar">10:57</div>
  <div style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div class="chat-area">
      <div class="wecom-card">

        <!-- 固定头部 -->
        <div class="card-header">
          <div class="card-title">AI行家助手</div>
          <div class="card-domain" id="cardDomain"></div>
          <div class="card-sub" id="cardSub">你好！今天需要帮你查什么？<br/>客户、订单、商品、发票……选一个开始吧 👇</div>
        </div>

        <!-- 首页菜单 -->
        <div class="menu-grid" id="menuGrid">
          <button class="menu-btn" onclick="selectDomain('customer')">🔍 找客户</button>
          <button class="menu-btn" onclick="selectDomain('product')">📦 查商品</button>
          <button class="menu-btn" onclick="selectDomain('order')">🗒️ 查订单</button>
          <button class="menu-btn" onclick="selectDomain('purchase')">🛒 采购查询</button>
          <button class="menu-btn" onclick="selectDomain('finance')">🧾 对账开票</button>
          <button class="menu-btn other" onclick="selectDomain('other')">➕ 其他</button>
        </div>

        <!-- 第二层：other 子菜单 -->
        <div class="sub-panel" id="subPanel">
          <div class="scroll-body">
            <div class="sub-list" id="subGrid"></div>
          </div>
          <div class="card-footer">
            <button class="footer-btn secondary" onclick="goHome()">返回上级</button>
            <button class="footer-btn primary" onclick="goHome()">返回菜单</button>
          </div>
        </div>

        <!-- 第三层：suggest 面板 -->
        <div class="suggest-panel" id="suggestPanel">
          <div class="scroll-body">
            <div class="suggest-list" id="suggestList"></div>
          </div>
          <div class="card-footer">
            <button class="footer-btn secondary" onclick="goSub()">返回上级</button>
            <button class="footer-btn primary" onclick="goHome()">返回菜单</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  const domains = {
    customer: {
      label: "找客户",
      suggests: [
        { text: '输入客户名称，发送 查客户 XX公司' },
        { text: '输入客户编码，发送 查商品池 C001，查询 / 下架该客户商品池 SKU' }
      ]
    },
    product: {
      label: "查商品",
      suggests: [
        { text: '发送关键词、SKU 或商品图片，AI 自动找货' },
        { text: '输入 SKU + 城市，发送 查商品 SKUXX 上海，查交期及库存' },
        { text: '输入 SKU，发送 查文件 SKUXX，获取商品资料文件' },
        { text: '输入品牌名称，发送 查授权 XX品牌，获取品牌授权文件' }
      ]
    },
    order: {
      label: "查订单",
      suggests: [
        { text: '输入订单号，发送 查物流 SOXXXX，查履约 / 物流进度' },
        { text: '输入客户编码，发送 查订单号 C001，查该客户名下的销售订单号' },
        { text: '输入采购单号 / VC 送货单号，发送 关联单号 XXXX，互查采购单号 / VC 送货单号 / SAP 销售订单号' },
        { text: '输入送货单号，发送 查送货单 XXXX，查送货单详情' },
        { dividerBefore: true, dividerText: "其他操作",
          text: '输入销售单号，发送 创建交货单 SOXXXX' },
        { text: '输入销售单号 / DN 单号，发送 取消交货单 XXXX' }
      ]
    },
    purchase: {
      label: "采购查询",
      suggests: [
        { text: '输入采购单号，发送 查采购单 XXXX，查采购单详情及状态' },
        { text: '输入采购单号，发送 查到货时间 XXXX，查预计到货时间' },
        { text: '输入采购单号，发送 查随货资料 XXXX，获取随货文件' }
      ]
    },
    finance: {
      label: "对账开票",
      suggests: [
        { text: '输入客户编码，发送 查信用 C001，查信用额度 / 逾期情况' },
        { text: '输入订单号，发送 查发票 SOXXXX，查发票状态 / 进度' },
        { dividerBefore: true, dividerText: "开票操作",
          text: '输入订单号，发送 申请开票 XXXX，支持单独 / 合并开票',
          tagsText: '支持单据类型：SAP销售单、OMS销售单、SAP交货单、OMS交货单、OMS外围单、其他格式',
          example: '例：申请开票 1500021012 1010096815 合并'
        }
      ]
    },
    other: {
      label: "其他",
      subDomains: [
        { key: 'find_person', title: '找人',       desc: '找产线 / 销售客服 / 仓库对接人 / 值班人员', hot: true },
        { key: 'knowledge',   title: '找知识',     desc: '公司制度 · 人事行政政策 · 工业品产品知识 · IT', hot: true },
        { key: 'personal',    title: '查个人信息',  desc: '考勤 / 假期 / 报销 / 津贴', hot: true },
        { key: 'oa',          title: 'OA 申请',    desc: '请假 · 补卡 · 会议 · 用印 · 合同签署', hot: true },
        { key: 'ticket',      title: '工单',       desc: '工单查询 / 一句话发工单', hot: false },
        { key: 'collab',      title: '协同',       desc: '协同查询 / 创建合同盖章申请', hot: false },
        { key: 'material',    title: '资料',       desc: '资料查询 / 获取模板中心文件', hot: false },
        { key: 'digital',     title: '数智化入口', desc: 'PRA / AI 开发者平台地址查询', hot: false }
      ]
    }
  };

  const subDomainDetails = {
    find_person: {
      label: "其他 · 找人",
      suggests: [
        { text: '发送 找产线 XX工厂，查找产线人员联系方式' },
        { text: '发送 找销售 XX公司，根据客户名称找对应销售 / 客服' },
        { text: '发送 找仓库 XX仓库，根据仓库名称找仓库对接人' },
        { text: '发送 查值班，查找当前值班人员' }
      ]
    },
    knowledge: {
      label: "其他 · 找知识",
      suggests: [
        { text: '发送 查制度 关键词，查公司制度 / 人事行政政策',
          example: '例：查制度 年假规则 · 查制度 报销流程' },
        { text: '发送 查产品知识 关键词，查询工业品领域产品知识',
          example: '例：查产品知识 断路器选型' },
        { text: '发送 查IT知识 关键词，查 IT 系统 / 工具相关问题',
          example: '例：查IT知识 VPN怎么连' }
      ]
    },
    personal: {
      label: "其他 · 查个人信息",
      suggests: [
        { text: '发送 查考勤，查询本月考勤记录' },
        { text: '发送 查假期，查询剩余假期余额' },
        { text: '发送 查报销，查询报销进度 / 记录' },
        { text: '发送 查津贴，查询津贴发放情况' }
      ]
    },
    oa: {
      label: "其他 · OA 申请",
      suggests: [
        { text: '直接说想请什么假、什么时间，AI 自动创建草稿',
          example: '例：帮我请假2个小时 明天下午' },
        { text: '直接说要补哪天哪个时段的卡，AI 自动创建草稿',
          example: '例：帮我补卡 昨天上午 忘打了' },
        { dividerBefore: true, dividerText: "会议",
          text: '说清时间和主题，AI 帮你预约会议',
          example: '例：预约会议 明天14:00 季度复盘' },
        { text: '说清会议和要改的内容，AI 帮你修改',
          example: '例：把明天的复盘会议改到15:00' },
        { text: '说清哪个会议，AI 帮你取消',
          example: '例：取消明天14:00的季度复盘会议' },
        { text: '发送 查我的会议，查看近期会议安排' },
        { dividerBefore: true, dividerText: "用印 · 签署",
          text: '发对账单文件 + 客户号，AI 自动发起用印申请',
          example: '例：发送文件后输入 A790013 06-30 客户对账单用印申请' },
        { text: '发合同文件 + 客户号金额，AI 自动发起签署申请',
          example: '例：发送文件后输入 A3425041 300元 客户合同签署申请' }
      ]
    },
    ticket: {
      label: "其他 · 工单",
      suggests: [
        { text: '发送 查工单，进入工单总入口，查询工单状态' },
        { text: '直接描述问题，发送 创建工单 问题描述，一句话发工单',
          example: '例：创建工单 客户C001反馈商品破损，需要处理' }
      ]
    },
    collab: {
      label: "其他 · 协同",
      suggests: [
        { text: '发送 查协同，进入协同总入口，查询协同任务' },
        { text: '输入销售订单号，发送 盖章申请 SOXXXX，创建合同盖章协同',
          example: '例：盖章申请 1500021012' }
      ]
    },
    material: {
      label: "其他 · 资料",
      suggests: [
        { text: '发送 查资料，进入资料总入口，查询资料文件' },
        { text: '发送 查模板 关键词，从模板中心获取对应文件',
          example: '例：查模板 合同模板' }
      ]
    },
    digital: {
      label: "其他 · 数智化入口",
      suggests: [
        { text: '发送 PRA地址，获取 PRA 平台入口链接' },
        { text: '发送 AI开发者平台，获取 AI 开发者平台入口链接' }
      ]
    }
  };

  let currentDomain = null;

  function setDomainLabel(text) {
    const el = document.getElementById("cardDomain");
    el.textContent = text;
    el.classList.add("visible");
  }

  function selectDomain(key) {
    currentDomain = key;
    const d = domains[key];
    setDomainLabel(d.label);
    document.getElementById("cardSub").style.display = "none";
    document.getElementById("menuGrid").style.display = "none";
    if (key === 'other') {
      renderSubGrid(d.subDomains);
      document.getElementById("subPanel").classList.add("active");
    } else {
      renderSuggests(d.suggests);
      document.getElementById("suggestPanel").classList.add("active");
    }
  }

  function renderSubGrid(subDomains) {
    const grid = document.getElementById("subGrid");
    grid.innerHTML = "";
    let otherShown = false;
    subDomains.forEach(s => {
      if (!s.hot && !otherShown) {
        const div = document.createElement("div");
        div.className = "section-divider";
        div.textContent = "其他功能";
        grid.appendChild(div);
        otherShown = true;
      }
      const item = document.createElement("div");
      item.className = "sub-item fade-up";
      item.innerHTML = `
        <div class="sub-item-title">${s.title}</div>
        <div class="sub-item-desc">${s.desc}</div>
      `;
      item.onclick = () => selectSubDomain(s.key);
      grid.appendChild(item);
    });
  }

  function selectSubDomain(key) {
    const d = subDomainDetails[key];
    setDomainLabel(d.label);
    document.getElementById("subPanel").classList.remove("active");
    renderSuggests(d.suggests);
    document.getElementById("suggestPanel").classList.add("active");
  }

  function renderSuggests(suggests) {
    const list = document.getElementById("suggestList");
    list.innerHTML = "";
    suggests.forEach((s, idx) => {
      if (s.dividerBefore) {
        const div = document.createElement("div");
        div.className = "section-divider";
        div.textContent = s.dividerText || "其他操作";
        list.appendChild(div);
      }
      const item = document.createElement("div");
      item.className = "suggest-item fade-up";
      if (s.dividerBefore || idx === 0) item.style.borderTop = "none";

      // tags 内容改为普通灰色文字
      let tagsHtml = s.tagsText
        ? `<div class="suggest-tags-text">${s.tagsText}</div>` : "";
      let exampleHtml = s.example
        ? `<div class="example-row">${s.example}</div>` : "";

      item.innerHTML = `
        <div class="suggest-text">${s.text}</div>
        ${tagsHtml}
        ${exampleHtml}
      `;
      list.appendChild(item);
    });
    list.closest('.scroll-body').scrollTop = 0;
  }

  function goSub() {
    document.getElementById("suggestPanel").classList.remove("active");
    if (currentDomain === 'other') {
      setDomainLabel(domains.other.label);
      renderSubGrid(domains.other.subDomains);
      document.getElementById("subPanel").classList.add("active");
    } else {
      goHome();
    }
  }

  function goHome() {
    document.getElementById("menuGrid").style.display = "grid";
    document.getElementById("subPanel").classList.remove("active");
    document.getElementById("suggestPanel").classList.remove("active");
    const el = document.getElementById("cardDomain");
    el.textContent = ""; el.classList.remove("visible");
    document.getElementById("cardSub").style.display = "block";
    currentDomain = null;
  }
</script>
</body>
</html>
